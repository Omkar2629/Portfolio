<h2>Generate Your CV</h2>

<form method="POST" action="{% url 'cv_preview' %}">
    {% csrf_token %}

    <input type="text" name="name" placeholder="Full Name"><br>
    <input type="email" name="email" placeholder="Email"><br>
    <input type="text" name="phone" placeholder="Phone"><br>

    <textarea name="education" placeholder="Education"></textarea><br>
    <textarea name="skills" placeholder="Skills"></textarea><br>
    <textarea name="projects" placeholder="Projects"></textarea><br>
    <textarea name="internships" placeholder="Internships"></textarea><br>
    <textarea name="certifications" placeholder="Certifications"></textarea><br>

    <input type="text" name="linkedin" placeholder="LinkedIn URL"><br>
    <input type="text" name="github" placeholder="GitHub URL"><br>

    <button type="submit">Generate CV</button>
</form>
