<!DOCTYPE html>
<html>
<head>
    <title>Manage Projects</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }

        .main-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .project-card {
            background: white;
            padding: 18px 22px;
            border-radius: 12px;
            border: 1px solid #e9ecef;
            transition: all 0.2s ease;
        }

        .project-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">Manage Projects</span>
    <div>
        <a href="{% url 'dashboard' %}" class="btn btn-outline-light btn-sm">
            Back
        </a>
    </div>
</nav>

<div class="container mt-5">

    <div class="main-card">

        <h4 class="mb-3">Add New Project</h4>

        <form method="POST">
            {% csrf_token %}

            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Project Title</label>
                    <input type="text" name="title" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Tech Stack</label>
                    <input type="text" name="tech_stack" class="form-control">
                </div>

                <div class="col-12">
                    <label class="form-label">Description</label>
                    <textarea name="description" rows="4" class="form-control"></textarea>
                </div>

                <div class="col-md-6">
                    <label class="form-label">GitHub Link</label>
                    <input type="url" name="github_link" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Live Link</label>
                    <input type="url" name="live_link" class="form-control">
                </div>

            </div>

            <button type="submit" class="btn btn-success mt-4">
                Add Project
            </button>

        </form>

        <hr class="my-5">

        <h4 class="mb-3">Existing Projects</h4>

        {% if projects %}
            {% for project in projects %}
            <div class="project-card mb-3 d-flex justify-content-between align-items-center">

                <div>
                    <h6 class="mb-1 fw-semibold">
                        {{ project.title }}
                    </h6>
                    <small class="text-muted">
                        {{ project.tech_stack }}
                    </small>
                </div>

                <form method="POST"
      action="{% url 'delete_project' project.id %}"
      onsubmit="return confirm('Delete this project?');"
      style="display:inline;">
    {% csrf_token %}
    <button type="submit"
            class="btn btn-outline-danger btn-sm">
        Delete
    </button>
</form>

            </div>
            {% endfor %}
        {% else %}
            <p class="text-muted">No projects added yet.</p>
        {% endif %}

    </div>

</div>

</body>
</html>
