<!DOCTYPE html>
<html>
<head>
    <title>Enter Name</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#0f172a; color:white; display:flex; justify-content:center; align-items:center; height:100vh;">

    <form method="POST" class="p-4 bg-dark rounded">
        {% csrf_token %}

        <h3 class="mb-3 text-info">Enter your name</h3>

        <input type="text" name="name" class="form-control mb-3" placeholder="Your Name" required>

        <button type="submit" class="btn btn-info w-100">Enter</button>
    </form>

</body>
</html>
