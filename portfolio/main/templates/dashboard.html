<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }

        .dashboard-card {
            padding: 35px;
            border-radius: 15px;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .module-card {
            padding: 25px;
            border-radius: 12px;
            background: #ffffff;
            border: 1px solid #e9ecef;
            transition: all 0.2s ease;
        }

        .module-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .module-title {
            font-weight: 600;
        }

        .count-number {
            font-size: 28px;
            font-weight: 700;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">Portfolio Dashboard</span>
    <div>
        <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">
            Logout
        </a>
    </div>
</nav>

<div class="container mt-5">
    <div class="dashboard-card">

        <h3 class="mb-1">Welcome, {{ request.user.username }}</h3>
        <p class="text-muted small">Manage your portfolio content from here.</p>
        <hr>

        <div class="row mt-4 g-4">

            <!-- Skills -->
            <div class="col-md-4">
                <div class="module-card text-center">
                    <div class="count-number text-primary">
                        {{ skill_count|default:"0" }}
                    </div>
                    <div class="module-title mb-2">Skills</div>
                    <a href="{% url 'manage_skills' %}"
                       class="btn btn-outline-primary btn-sm">
                        Manage Skills
                    </a>
                </div>
            </div>

            <!-- Projects -->
            <div class="col-md-4">
                <div class="module-card text-center">
                    <div class="count-number text-success">
                        {{ project_count|default:"0" }}
                    </div>
                    <div class="module-title mb-2">Projects</div>
                    <a href="{% url 'manage_projects' %}"
                       class="btn btn-outline-success btn-sm">
                        Manage Projects
                    </a>
                </div>
            </div>

            <!-- Certifications -->
            <div class="col-md-4">
                <div class="module-card text-center">
                    <div class="count-number text-info">
                        {{ cert_count|default:"0" }}
                    </div>
                    <div class="module-title mb-2">Certifications</div>
                    <a href="{% url 'manage_certifications' %}"
                       class="btn btn-outline-info btn-sm">
                        Manage Certifications
                    </a>
                </div>
            </div>

        </div>

    </div>
</div>

</body>
</html>
