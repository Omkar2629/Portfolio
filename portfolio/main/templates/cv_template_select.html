<!DOCTYPE html>
<html>
<head>
    <title>Choose CV Template</title>
    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            padding: 40px;
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            max-width: 1000px;
            margin: auto;
        }

        .card {
            background: #111827;
            padding: 20px;
            border-radius: 12px;
            transition: 0.25s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(56,189,248,0.25);
        }

        .btn {
            margin-top: 12px;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #38bdf8;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>Choose Your CV Template</h1>

<div class="grid">

    <div class="card">
        <h3>General</h3>
        <a href="{% url 'render_selected_cv' 'generalised' %}">
            <button class="btn">Use Template</button>
        </a>
    </div>

    <div class="card">
        <h3>Modern</h3>
        <a href="{% url 'render_selected_cv' 'modern' %}">
            <button class="btn">Use Template</button>
        </a>
    </div>

    <div class="card">
        <h3>Minimal</h3>
        <a href="{% url 'render_selected_cv' 'minimal' %}">
            <button class="btn">Use Template</button>
        </a>
    </div>

    <div class="card">
        <h3>Dark Pro</h3>
        <a href="{% url 'render_selected_cv' 'dark' %}">
            <button class="btn">Use Template</button>
        </a>
    </div>

</div>

</body>
</html>
