<!DOCTYPE html>
<html>
<head>
    <title>Manage Skills</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }

        .main-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .skill-card {
            background: white;
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid #e9ecef;
            transition: all 0.2s ease;
        }

        .skill-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(0,0,0,0.08);
        }

        .category-badge {
            font-size: 12px;
            background: #0d6efd;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">Manage Skills</span>
    <div>
        <a href="{% url 'dashboard' %}" class="btn btn-outline-light btn-sm">
            Back
        </a>
    </div>
</nav>

<div class="container mt-5">

    <div class="main-card">

        <h4 class="mb-3">Add New Skill</h4>

        <form method="POST">
            {% csrf_token %}

            <div class="row g-3">

                <div class="col-md-4">
                    <label class="form-label">Skill Category</label>
                    <input type="text" name="category" class="form-control" placeholder="Soft Skills / Tools" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Skill Name</label>
                    <input type="text" name="name" class="form-control" placeholder="Enter skill" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Proficiency (Optional)</label>
                    <input type="text" name="proficiency" class="form-control" placeholder="Beginner / Intermediate / Expert">
                </div>

            </div>

            <button type="submit" class="btn btn-primary mt-4">
                Add Skill
            </button>

        </form>

        <hr class="my-5">

        <h4 class="mb-3">Existing Skills</h4>

        {% if skills %}
            {% for skill in skills %}
            <div class="skill-card mb-3 d-flex justify-content-between align-items-center">

                <div>
                    <span class="badge category-badge mb-2">
                        {{ skill.category }}
                    </span>

                    <h6 class="mb-1 fw-semibold">
                        {{ skill.name }}
                    </h6>

                    {% if skill.proficiency %}
                    <small class="text-muted">
                        {{ skill.proficiency }}
                    </small>
                    {% endif %}
                </div>

                <!-- ✅ ACTION BUTTONS -->
                <div class="action-buttons">

                    <!-- ✏️ EDIT BUTTON -->
                    <a href="{% url 'edit_skill' skill.id %}"
                       class="btn btn-outline-primary btn-sm">
                        Edit
                    </a>

                    <!-- 🗑 DELETE BUTTON -->
                    <form method="POST"
                          action="{% url 'delete_skill' skill.id %}"
                          onsubmit="return confirm('Delete this skill?');">
                        {% csrf_token %}
                        <button type="submit"
                                class="btn btn-outline-danger btn-sm">
                            Delete
                        </button>
                    </form>

                </div>

            </div>
            {% endfor %}
        {% else %}
            <p class="text-muted">No skills added yet.</p>
        {% endif %}

    </div>

</div>

</body>
</html>
