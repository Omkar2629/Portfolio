<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page not found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f7fa;
        }
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-box {
            text-align: center;
            max-width: 420px;
        }
        .error-code {
            font-size: 72px;
            font-weight: 700;
            color: #212529;
            margin-bottom: 10px;
        }
        .error-text {
            color: #6c757d;
        }
    </style>
</head>
<body>

<div class="error-container">
    <div class="error-box">

        <div class="error-code">404</div>

        <h5 class="fw-semibold mb-2">Page not found</h5>

        <p class="error-text mb-4">
            The page you’re looking for doesn’t exist or may have been moved.
        </p>

        <a href="{% url 'home' %}" class="btn btn-dark btn-sm px-4">
            Go back home
        </a>

    </div>
</div>

</body>
</html>
